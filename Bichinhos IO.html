<style>
:root{--bg:#1d2b22;--card:#fffaf0;--ink:#2b2a33;--acc:#ff8a5c;--acc2:#5a47c4}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#1d2b22;--card:#fffaf0;--ink:#2b2a33}}

.card{background:var(--card);color:var(--ink);border-radius:22px;padding:20px;width:100%;max-width:440px;box-shadow:0 12px 40px rgba(0,0,0,.35);text-align:center}

<script src="https://cdn.jsdelivr.net/npm/peerjs@1.5.4/dist/peerjs.min.js"></script>
<script>
/* Bichinhos.io - motor do jogo (roda no navegador e no Node) */
(function (root) {
'use strict';
const W = 3600, H = 3600, CX = W / 2, CY = H / 2, R = Math.random, TAU = Math.PI * 2;
const rnd = (a, b) => a + R() * (b - a);
const clamp = (v, a, b) => v < a ? a : v > b ? b : v;
const angDiff = (a, b) => { let d = a - b; while (d > Math.PI) d -= TAU; while (d < -Math.PI) d += TAU; return d; };
const r1 = v => Math.round(v);

const CLASSES = {
  guerreiro: { name: 'Guerreiro', emoji: '⚔️', desc: 'Corpo a corpo. Espada e Giro Ciclone.', color: '#ff8a5c', dark: '#b9502f', hp: 140, speed: 212, range: 78, cd: 0.42, skillCd: 6, labels: ['Espada', 'Giro Ciclone', 'Armadura', 'Vitalidade'] },
  mago:      { name: 'Mago', emoji: '🔮', desc: 'Magia à distância. Meteoros devastadores.', color: '#9a86ff', dark: '#5a47c4', hp: 95, speed: 208, range: 620, cd: 0.55, skillCd: 7, labels: ['Cajado', 'Meteoro', 'Manto Arcano', 'Vitalidade'] },
  arqueiro:  { name: 'Arqueiro', emoji: '🏹', desc: 'Rápido e ágil. Rajada de flechas.', color: '#4fd18b', dark: '#2a925b', hp: 105, speed: 228, range: 700, cd: 0.32, skillCd: 5, labels: ['Arco', 'Rajada', 'Couraça', 'Vitalidade'] }
};
const CLS_KEYS = Object.keys(CLASSES);
const UPK = ['weapon', 'skill', 'armor', 'vital'];
const TIER_NAMES = ['Filhote', 'Aprendiz', 'Aventureiro', 'Veterano', 'Elite', 'Campeão', 'Lenda', 'Mítico', 'Divino', 'Celestial'];
const MOB_NAMES = ['Gosma', 'Cogumelo', 'Lobo', 'Golem', 'Demônio'];
const MOBS = { hp: [30, 75, 170, 400, 950], dmg: [6, 10, 16, 26, 40], sp: [80, 90, 100, 110, 120], r: [14, 18, 24, 30, 38], xp: [10, 20, 40, 80, 160], gold: [4, 8, 16, 32, 64] };
const BOT_NAMES = ['Pipoca', 'Zeca', 'Luna', 'Bolt', 'Mel', 'Nico', 'Gatuno', 'Tita', 'Fênix', 'Bruxo', 'Sombra', 'Dudu', 'Kiko', 'Lobinho', 'Nuvem', 'Pingo', 'Raio', 'Thor', 'Mimi', 'Zumbi', 'Fagulha', 'Neo', 'Jujuba', 'Capitão', 'Trovão', 'Biscoito', 'Cometa', 'Ninja', 'Duda', 'Rex'];
const MOB_COUNT = 100, ORB_COUNT = 320;

const xpNeed = l => Math.floor(30 + 20 * Math.pow(l, 1.6));
const upCost = n => Math.floor(15 * Math.pow(1.3, n) + 10 * n);
const tierName = t => t < TIER_NAMES.length ? TIER_NAMES[t] : 'Celestial ' + (t - TIER_NAMES.length + 2);
const dmgMul = p => (1 + 0.22 * p.up.weapon) * (1 + 0.07 * p.lvl);
const skMul = p => (1 + 0.25 * p.up.skill) * (1 + 0.07 * p.lvl);
const zoneTier = (x, y) => { const d = Math.hypot(x - CX, y - CY) / CX; return d < .22 ? 4 : d < .42 ? 3 : d < .62 ? 2 : d < .8 ? 1 : 0; };

function recalc(p, init) {
  const c = CLASSES[p.cls], old = p.maxhp;
  p.maxhp = Math.round(c.hp + 22 * p.up.vital + 14 * (p.lvl - 1));
  p.tier = Math.floor((p.lvl - 1) / 5);
  p.r = 18 + Math.min(p.tier * 2.2, 26);
  p.speed = c.speed * (1 + Math.min(.3, .004 * p.lvl));
  p.armor = 6 * p.up.armor + 2.5 * p.lvl;
  if (!init && p.maxhp > old) p.hp += p.maxhp - old;
}

class World {
  constructor(o) {
    o = o || {};
    this.time = 0; this.nid = 1;
    this.players = new Map(); this.mobs = []; this.orbs = []; this.proj = []; this.meteors = [];
    this.events = []; this.dead = new Map(); this.tg = [];
    this.pvp = !!o.pvp;
    this.bx0 = 0; this.by0 = 0; this.bx1 = W; this.by1 = H;
    if (this.pvp) { this.bx0 = CX - 800; this.by0 = CY - 800; this.bx1 = CX + 800; this.by1 = CY + 800; }
    this.mobMax = this.pvp ? 0 : MOB_COUNT; this.orbMax = this.pvp ? 0 : ORB_COUNT;
    this.botTarget = o.bots == null ? (this.pvp ? 0 : 12) : o.bots; this.nextBot = 0;
    this.lb = []; this.lbT = -9;
    for (let i = 0; i < this.mobMax; i++) this.spawnMob();
    for (let i = 0; i < this.orbMax; i++) this.spawnOrb();
    for (let i = 0; i < this.botTarget; i++) this.spawnBot(true);
  }
  ev(e) { if (this.events.length < 500) this.events.push(e); }
  flushEvents() { this.events.length = 0; }

  /* ---------- criação ---------- */
  addPlayer(name, cls, bot) {
    if (!CLASSES[cls]) cls = 'guerreiro';
    let bx = 0, by = 0, bd = -1;
    for (let k = 0; k < 10; k++) {
      const a = R() * TAU, rad = rnd(.85, 1.15) * CX;
      let x = clamp(CX + Math.cos(a) * rad, 150, W - 150), y = clamp(CY + Math.sin(a) * rad, 150, H - 150);
      if (this.pvp) { x = rnd(this.bx0 + 120, this.bx1 - 120); y = rnd(this.by0 + 120, this.by1 - 120); }
      let md = 1e9; for (const q of this.players.values()) md = Math.min(md, Math.hypot(q.x - x, q.y - y));
      if (md > bd) { bd = md; bx = x; by = y; }
    }
    const p = {
      id: this.nid++, name: String(name || 'Bichinho').slice(0, 14), cls, bot: !!bot, isPlayer: true,
      x: bx, y: by, prot: this.time + (this.pvp ? 3 : 8),
      vx: 0, vy: 0, a: 0, lvl: 1, xp: 0, gold: 0, score: 0, kills: 0,
      up: { weapon: 0, skill: 0, armor: 0, vital: 0 }, hp: 1, maxhp: 1, r: 18, tier: 0, speed: 200, armor: 0,
      cd: 0, scd: 0, dcd: 0, dashT: 0, dx: 0, dy: 0, swing: 0, lastHit: -99,
      inp: { mx: 0, my: 0, a: 0, atk: false, skill: false, dash: false, sd: 260 }
    };
    if (this.pvp) { p.lvl = 10; for (const k of UPK) p.up[k] = 3; }
    recalc(p, true); p.hp = p.maxhp;
    if (bot) p.ai = { t: 0, st: 0, strafe: 1, brave: rnd(.6, 1.4), err: rnd(.04, .16), wx: p.x, wy: p.y, wt: 0 };
    this.players.set(p.id, p);
    return p;
  }
  spawnBot(init) {
    const cls = CLS_KEYS[(R() * 3) | 0];
    const hs = [...this.players.values()].filter(p => !p.bot);
    let L;
    if (init || !hs.length) L = 1 + ((R() * (init ? 6 : 4)) | 0);
    else L = Math.max(1, Math.round(hs.reduce((a, p) => a + p.lvl, 0) / hs.length * rnd(.5, 1.1)));
    const p = this.addPlayer(BOT_NAMES[(R() * BOT_NAMES.length) | 0], cls, true);
    if (this.pvp) return;
    p.lvl = L; p.gold = L * 22; p.score = 0;
    for (let i = 1; i < L; i++) p.score += xpNeed(i);
    recalc(p, true); p.hp = p.maxhp;
  }
  spawnMob() {
    const wt = [38, 30, 20, 12, 8]; let r = R() * 100, t = 0;
    while (t < 4 && r >= wt[t]) { r -= wt[t]; t++; }
    const lo = [.8, .62, .42, .22, 0][t], hi = [1.3, .8, .62, .42, .22][t];
    const rad = rnd(lo, hi) * CX, a = R() * TAU;
    const x = clamp(CX + Math.cos(a) * rad, 60, W - 60), y = clamp(CY + Math.sin(a) * rad, 60, H - 60);
    this.mobs.push({ id: this.nid++, x, y, hx: x, hy: y, vx: 0, vy: 0, tier: t, hp: MOBS.hp[t], maxhp: MOBS.hp[t], r: MOBS.r[t], cd: 0, wa: R() * TAU, wt: 0, mv: false });
  }
  spawnOrb() {
    const x = rnd(60, W - 60), y = rnd(60, H - 60), t = zoneTier(x, y), m = [1, 2, 4, 8, 16][t], k = R() < .6 ? 0 : 1;
    this.orbs.push({ id: this.nid++, x, y, k, t, v: k ? 2 * m : 4 * m });
  }

  /* ---------- API pública ---------- */
  setInput(id, inp) {
    const p = this.players.get(id); if (!p || !inp) return; const i = p.inp;
    const f = (v, d) => Number.isFinite(+v) ? +v : d;
    i.mx = clamp(f(inp.mx, 0), -1, 1); i.my = clamp(f(inp.my, 0), -1, 1); i.a = f(inp.a, i.a);
    i.atk = !!inp.atk; if (inp.skill) i.skill = true; if (inp.dash) i.dash = true;
    i.sd = clamp(f(inp.sd, 260), 60, 500);
  }
  upgrade(id, k) {
    const p = this.players.get(id); if (this.pvp || !p || !(k in p.up)) return false;
    const c = upCost(p.up[k]); if (p.gold < c) return false;
    p.gold -= c; p.up[k]++; recalc(p); return true;
  }

  /* ---------- combate ---------- */
  hurt(t, dmg, src, kx, ky) {
    if (t.dead) return;
    if (t.isPlayer) { if (t.dashT > 0 || this.time < t.prot) return; dmg *= 100 / (100 + t.armor); t.lastHit = this.time; }
    else if (src && src.isPlayer) t.tgt = src.id;
    t.hp -= dmg;
    if (kx !== undefined) { t.vx += kx; t.vy += ky; }
    this.ev({ e: 'dmg', x: r1(t.x), y: r1(t.y - t.r), v: Math.max(1, r1(dmg)), i: t.id });
    if (t.hp <= 0) this.kill(t, src);
  }
  reward(p, xp, gold) {
    p.gold += gold; p.score += xp; p.xp += xp;
    while (p.xp >= xpNeed(p.lvl)) {
      p.xp -= xpNeed(p.lvl); p.lvl++; recalc(p);
      p.hp = Math.min(p.maxhp, p.hp + p.maxhp * .3);
      this.ev({ e: 'lvl', x: r1(p.x), y: r1(p.y), i: p.id, l: p.lvl });
    }
  }
  kill(t, src) {
    t.dead = true;
    if (t.isPlayer) {
      this.players.delete(t.id);
      this.ev({ e: 'death', x: r1(t.x), y: r1(t.y), c: CLASSES[t.cls].color });
      this.ev({ e: 'kill', a: src ? src.name : 'Um monstro', b: t.name });
      if (src && src.isPlayer) {
        src.kills++;
        if (this.pvp) { src.score++; src.hp = Math.min(src.maxhp, src.hp + src.maxhp * .25); }
        else this.reward(src, 40 + t.lvl * 14, Math.floor(t.gold * .6) + 10 + t.lvl * 3);
      }
      if (this.pvp) { if (!t.bot) this.dead.set(t.id, { lvl: t.lvl, kills: t.kills, score: r1(t.score), by: src ? src.name : 'um monstro', tier: t.tier }); return; }
      const g = Math.floor(t.gold * .4), z = zoneTier(t.x, t.y);
      for (let i = 0; i < 6; i++) this.orbs.push({ id: this.nid++, x: clamp(t.x + rnd(-50, 50), 30, W - 30), y: clamp(t.y + rnd(-50, 50), 30, H - 30), k: i % 2, t: z, v: Math.max(1, Math.ceil((i % 2 ? g : t.lvl * 6) / 3)) });
      if (!t.bot) this.dead.set(t.id, { lvl: t.lvl, kills: t.kills, score: r1(t.score), by: src ? src.name : 'um monstro', tier: t.tier });
    } else {
      this.ev({ e: 'death', x: r1(t.x), y: r1(t.y), c: ['#7be08f', '#ff7a7a', '#b8c0c8', '#9aa3ad', '#ff5a3a'][t.tier] });
      if (src && src.isPlayer) this.reward(src, MOBS.xp[t.tier], MOBS.gold[t.tier]);
    }
  }
  shoot(p, a, spd, dmg, r, kind, life) {
    this.proj.push({ id: this.nid++, x: p.x + Math.cos(a) * p.r, y: p.y + Math.sin(a) * p.r, vx: Math.cos(a) * spd, vy: Math.sin(a) * spd, dmg, r, kind, own: p.id, life });
  }
  attack(p) {
    const c = CLASSES[p.cls], dm = dmgMul(p), co = Math.cos(p.a), si = Math.sin(p.a);
    p.cd = c.cd;
    if (p.cls === 'guerreiro') {
      p.swing = .2; const rng = c.range + p.r;
      this.ev({ e: 'slash', x: r1(p.x), y: r1(p.y), a: Math.round(p.a * 100) / 100, r: r1(rng) });
      for (const t of this.tg) {
        if (t === p || t.dead) continue;
        const dx = t.x - p.x, dy = t.y - p.y, d = Math.hypot(dx, dy);
        if (d < rng + t.r && Math.abs(angDiff(Math.atan2(dy, dx), p.a)) < 1.0) this.hurt(t, 14 * dm, p, co * 140, si * 140);
      }
      p.vx += co * 120; p.vy += si * 120;
    } else if (p.cls === 'mago') this.shoot(p, p.a, 560, 11 * dm, 10, 'orb', c.range / 560);
    else this.shoot(p, p.a, 820, 8 * dm, 5, 'arrow', c.range / 820);
  }
  skill(p) {
    const c = CLASSES[p.cls], sm = skMul(p); p.scd = c.skillCd;
    if (p.cls === 'guerreiro') {
      p.swing = .35; const rr = 112;
      this.ev({ e: 'spin', x: r1(p.x), y: r1(p.y), r: rr + p.r });
      for (const t of this.tg) {

  for (const p of snap.pm) { const me2 = p[0] === me.id; ctx.fillStyle = me2 ? '#fff' : '#e8403a'; ctx.beginPath(); ctx.arc(mx0 + (p[1] - AR[0]) * k, my0 + (p[2] - AR[1]) * k, me2 ? 4 : 2.4, 0, TAU); ctx.fill(); if (me2) { ctx.strokeStyle = '#222'; ctx.lineWidth = 1.5; ctx.stroke(); } }
  ctx.restore(); ctx.strokeStyle = 'rgba(255,255,255,.8)'; ctx.lineWidth = 2; rr(mx0, my0, ms, ms, 12); ctx.stroke();

}
function drawCdBtn(b, icon, frac, left, col) {
  ctx.fillStyle = 'rgba(0,0,0,.35)'; ctx.beginPath(); ctx.arc(b.x, b.y, b.r, 0, TAU); ctx.fill();
  ctx.fillStyle = col; ctx.globalAlpha = left > 0 ? .45 : .9; ctx.beginPath(); ctx.arc(b.x, b.y, b.r - 4, 0, TAU); ctx.fill(); ctx.globalAlpha = 1;
  if (left > 0) { ctx.fillStyle = 'rgba(0,0,0,.5)'; ctx.beginPath(); ctx.moveTo(b.x, b.y); ctx.arc(b.x, b.y, b.r - 4, -Math.PI / 2, -Math.PI / 2 + TAU * frac); ctx.closePath(); ctx.fill(); }
  ctx.font = Math.round(b.r * .8) + 'px system-ui'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle'; ctx.fillStyle = '#fff'; ctx.fillText(icon, b.x, b.y + 1);
  if (left > 0) txt(left.toFixed(1), b.x, b.y, 14);
}
function drawTouch(me) {
  if (stick) { ctx.fillStyle = 'rgba(255,255,255,.18)'; ctx.beginPath(); ctx.arc(stick.ox, stick.oy, 55 * bs, 0, TAU); ctx.fill(); const dx = stick.x - stick.ox, dy = stick.y - stick.oy, L = Math.hypot(dx, dy), M = 55 * bs, f = L > M ? M / L : 1; ctx.fillStyle = 'rgba(255,255,255,.55)'; ctx.beginPath(); ctx.arc(stick.ox + dx * f, stick.oy + dy * f, 24 * bs, 0, TAU); ctx.fill(); }
  const col = CL[me.cls].color;
  ctx.fillStyle = 'rgba(0,0,0,.35)'; ctx.beginPath(); ctx.arc(B.atk.x, B.atk.y, B.atk.r, 0, TAU); ctx.fill();
  ctx.fillStyle = atkT ? '#ffb199' : col; ctx.globalAlpha = .9; ctx.beginPath(); ctx.arc(B.atk.x, B.atk.y, B.atk.r - 5, 0, TAU); ctx.fill(); ctx.globalAlpha = 1;
  ctx.font = Math.round(B.atk.r * .8) + 'px system-ui'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle'; ctx.fillStyle = '#fff'; ctx.fillText(CL[me.cls].emoji, B.atk.x, B.atk.y + 1);
  if (atkT) { const dx = atkT.x - B.atk.x, dy = atkT.y - B.atk.y; if (Math.hypot(dx, dy) > 26 * bs) { ctx.strokeStyle = 'rgba(255,255,255,.8)'; ctx.lineWidth = 4; ctx.beginPath(); ctx.moveTo(B.atk.x, B.atk.y); ctx.lineTo(B.atk.x + dx, B.atk.y + dy); ctx.stroke(); } }
  drawCdBtn(B.skill, '✨', me.cs[0] / me.cm[0], me.cs[0], '#8f7bff'); drawCdBtn(B.dash, '💨', me.cs[1] / me.cm[1], me.cs[1], '#4fb7ff');
  if (skT) { const dx = skT.x - skT.ox, dy = skT.y - skT.oy; if (Math.hypot(dx, dy) > 24 * bs) { ctx.strokeStyle = 'rgba(255,255,255,.85)'; ctx.lineWidth = 3; ctx.setLineDash([8, 6]); ctx.beginPath(); ctx.moveTo(B.skill.x, B.skill.y); ctx.lineTo(B.skill.x + dx, B.skill.y + dy); ctx.stroke(); ctx.setLineDash([]); } }
}
function drawKbHud(me) {
  const y = h - 42; const sb = { x: w / 2 - 40, y, r: 24 }, db = { x: w / 2 + 40, y, r: 24 };
  drawCdBtn(sb, '✨', me.cs[0] / me.cm[0], me.cs[0], '#8f7bff'); drawCdBtn(db, '💨', me.cs[1] / me.cm[1], me.cs[1], '#4fb7ff');
  txt('E', sb.x, y + 32, 11, '#fff'); txt('ESPAÇO', db.x, y + 32, 11, '#fff');
}

/* ---------- loop ---------- */
let last = performance.now(), acc = 0, netAcc = 0;
function frame(now) {
  requestAnimationFrame(frame);
  const dt = Math.min(.05, (now - last) / 1000); last = now; frameNo++;
  const playing = state === 'play';
  if (playing) buildInput();
  if (world && ((mode === 'off' && playing) || (mode === 'host' && (playing || state === 'dead')))) {
    if (playing) world.setInput(myId, I);
    acc += dt; while (acc >= 1 / 60) { world.step(1 / 60); acc -= 1 / 60; }
    if (playing) { const sn = world.snapshot(myId); if (sn.dead) showDead(sn.info); else applySnap(sn); }
    if (mode === 'host') {
      for (const e of world.events) evBuf.push(e);
      if (evBuf.length > 400) evBuf.splice(0, evBuf.length - 400);
      hostNetAcc += dt; if (hostNetAcc >= .05) { hostNetAcc = 0; sendGuests(); }
    }
    world.flushEvents();
  } else if (mode === 'guest' && link && playing) {
    netAcc += dt;
    if (netAcc >= .05 || I.skill || I.dash) { netAcc = 0; link.send({ t: 'in', mx: +I.mx.toFixed(2), my: +I.my.toFixed(2), a: +I.a.toFixed(2), atk: I.atk, skill: I.skill, dash: I.dash, sd: Math.round(I.sd) }); }
  }
  if (playing) updateUps(now);
  if (state === 'dead' || state === 'play' || (state === 'menu' && snap)) render(dt, now); else { ctx.setTransform(dpr, 0, 0, dpr, 0, 0); ctx.fillStyle = '#5fae5f'; ctx.fillRect(0, 0, w, h); }
}
requestAnimationFrame(frame);
